{% extends 'index.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <section class="bg-light rounded shadow p-4">
                <h1 class="text-center border-bottom border-danger pb-2">Registro de Empleado</h1>
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Registrarse</button>
                        <a href="{% url 'login' %}" class="text-center mt-2">¿Ya tienes cuenta? Entra aquí</a>
                    </div>
                </form>
            </section>
        </div>
    </div>
</div>
{% endblock %}
