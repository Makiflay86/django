{% extends 'index.html' %}

{% block title %}
<title>Acceso Empleados</title>
{% endblock title %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
            <section class="bg-light rounded shadow my-5">
                <div class="text-center py-3 border-bottom border-danger">
                    <h1>Acceso Agencia</h1>
                </div>
                <article class="p-4">
                    <form method="POST" class="form">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>

                        {% if form.errors %}
                            <div class="alert alert-danger p-2">
                                <small>Usuario o contraseña incorrectos.</small>
                            </div>
                        {% endif %}

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger">Entrar al Sistema</button>
                        </div>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">¿Eres un nuevo trabajador?</p>
                        <a href="{% url 'register' %}" class="btn btn-link">Crea tu cuenta aquí</a>
                    </div>
                </article>
            </section>
        </div>
    </div>
</div>
{% endblock content %}
