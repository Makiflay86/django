{% extends "index.html" %}

{% block title %}
<title>Editar Extra - AutoManage</title>
{% endblock title %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white py-3 border-bottom d-flex align-items-center">
                    <i class="bi bi-plus-circle-fill fs-4 text-primary me-2"></i>
                    <h5 class="fw-bold mb-0">Modificar Extra</h5>
                </div>
                <div class="card-body p-4 bg-light-subtle">
                    <form method="POST" class="form-container">
                        {% csrf_token %}
                        
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="fw-bold text-dark small text-uppercase mb-1">{{ field.label }}</label>
                                <div class="input-group-sm">
                                    {{ field }}
                                </div>
                                {% if field.errors %}
                                    <div class="text-danger mt-1" style="font-size: 0.75rem;">{{ field.errors }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}

                        <div class="mt-4 d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-sm rounded-pill px-4 fw-bold shadow-sm">
                                <i class="bi bi-check-lg me-1"></i>Actualizar
                            </button>
                            <a href="{% url 'extras' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-4">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
