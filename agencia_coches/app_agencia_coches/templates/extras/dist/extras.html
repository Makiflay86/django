{%extends 'index.html'%}

{%block title%}
<title>Lista de extras</title>
{%endblock title%}

{%block content%}
<div class="container">

    <div class="my-3 d-flex justify-content-center">
        <a href="{% url 'extras_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle-dotted"></i>
            Añadir extra
        </a>
    </div>


    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        {% for extra in extras %}
            <div class="col">
                <div class="card h-100 shadow-sm border-0 card-hover">
                    
                    <div class="card-body">
                        <h5 class="card-title">{{ extra }}</h5>
                    </div>

                    <div class="card-footer bg-white d-flex justify-content-between border-0 pb-3 shadow">
                        <a href="" class="btn btn-sm btn-warning">
                            Editar
                        </a>

                        <a href="" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-x-lg"></i>
                        </a>
                    </div>

                </div>
            </div>
        {% endfor %}
    </div>
</div>
{%endblock content%}
